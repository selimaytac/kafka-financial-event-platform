# Argo CD manages itself after bootstrap (ADR 0028 bootstrap-and-adopt, ADR 0030).
# SSO (Dex) and notifications are not used yet; they are enabled when needed.
dex:
  enabled: false

notifications:
  enabled: false

configs:
  params:
    # TLS terminates at the platform Gateway (ADR 0035); argocd-server serves plain HTTP inside.
    server.insecure: true
    # Compare against a server-side dry-run apply, so defaults filled in by the API server
    # (e.g. Gateway API fields) and mutating webhooks do not show up as permanent drift.
    controller.diff.server.side: "true"
  repositories:
    # Helm OCI registry for charts published only as OCI artifacts (e.g. Envoy Gateway).
    envoyproxy-oci:
      name: envoyproxy
      type: helm
      url: docker.io/envoyproxy
      enableOCI: "true"

# Metrics Services only; the ServiceMonitor lives in the monitoring component (ADR 0037).
controller:
  metrics:
    enabled: true
server:
  metrics:
    enabled: true
repoServer:
  metrics:
    enabled: true
applicationSet:
  metrics:
    enabled: true
