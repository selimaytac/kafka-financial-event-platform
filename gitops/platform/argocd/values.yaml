# Argo CD manages itself after bootstrap (ADR 0028 bootstrap-and-adopt, ADR 0030).
# SSO (Dex) and notifications are not used yet; they are enabled when needed.
dex:
  enabled: false

notifications:
  enabled: false

configs:
  params:
    # TLS terminates at the platform Gateway (ADR 0035); argocd-server serves plain HTTP inside.
    server.insecure: true
  repositories:
    # Helm OCI registry for charts published only as OCI artifacts (e.g. Envoy Gateway).
    envoyproxy-oci:
      name: envoyproxy
      type: helm
      url: docker.io/envoyproxy
      enableOCI: "true"

# Metrics Services only; the ServiceMonitor lives in the monitoring component (ADR 0037).
# Resources are sized from measured peaks with headroom (ADR 0037). The application
# controller caches every watched object; large CRDs push it past 1 GiB.
controller:
  metrics:
    enabled: true
  resources:
    requests: { cpu: 250m, memory: 768Mi }
    limits: { memory: 1536Mi }
server:
  metrics:
    enabled: true
  resources:
    requests: { cpu: 20m, memory: 64Mi }
    limits: { memory: 192Mi }
repoServer:
  metrics:
    enabled: true
  resources:
    requests: { cpu: 50m, memory: 192Mi }
    limits: { memory: 512Mi }
applicationSet:
  metrics:
    enabled: true
  resources:
    requests: { cpu: 20m, memory: 64Mi }
    limits: { memory: 192Mi }
redis:
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 96Mi }
