# https://taskfile.dev
version: "3"

vars:
  REQUIRED_TOOLS: docker kind kubectl helm tofu pre-commit gitleaks kubeconform
  # Secret zero (ADR 0026): state encryption passphrase in the OS keychain (macOS `security` CLI).
  KEYCHAIN_SERVICE: platform-labs.kafka-financial-event-platform.tofu-state
  STORE_DIR: infra/stacks/foundation/store
  BUCKET_DIR: infra/stacks/foundation/bucket

# Shared by every OpenTofu task. The passphrase comes from TOFU_STATE_PASSPHRASE
# when set (CI, hosts without keychain support), otherwise from the OS keychain.
env:
  # Lab-owned provider cache: ~/.terraform.d may belong to other tools on the host.
  TF_PLUGIN_CACHE_DIR:
    sh: echo "${PLATFORM_DATA_DIR:-$HOME/platform-labs-data/kafka-financial-event-platform}/plugin-cache"

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  tools:check:
    desc: Verify required CLI tools are installed
    cmds:
      - for: { var: REQUIRED_TOOLS, split: " " }
        cmd: command -v {{.ITEM}} >/dev/null || (echo "missing - {{.ITEM}}" && exit 1)
      - echo "all required tools present"
    silent: true

  setup:
    desc: Install git hooks (pre-commit + commit-msg)
    deps: [tools:check]
    cmds:
      - pre-commit install --install-hooks

  lint:
    desc: Run all pre-commit hooks against the whole repository
    cmds:
      - pre-commit run --all-files

  secrets:scan:
    desc: Scan full git history for leaked secrets
    cmds:
      - gitleaks git --redact --verbose .

  hooks:update:
    desc: Bump hooks and pin them to commit SHAs (review the diff; autoupdate only sees tags on each repo's default branch)
    cmds:
      - pre-commit autoupdate --freeze

  docs:check:
    desc: Verify relative links in all Markdown files
    cmds:
      - pre-commit run markdown-relative-links --all-files

  secrets:init:
    desc: Create the state encryption passphrase (secret zero) in the OS keychain if missing
    platforms: [darwin]
    cmds:
      - |
        if security find-generic-password -s "{{.KEYCHAIN_SERVICE}}" >/dev/null 2>&1; then
          echo "secret zero already present in the Keychain"
        else
          security add-generic-password -a "$USER" -s "{{.KEYCHAIN_SERVICE}}" -w "$(openssl rand -base64 32)"
          echo "secret zero created. Back it up in a password manager; without it all state is unreadable."
        fi
    silent: true

  # Foundation (ADR 0025): two small stacks with local, encrypted state.
  # store: SeaweedFS container and credentials. bucket: state bucket and versioning.
  # They are separate because the bucket's provider needs credentials known at plan time.
  foundation:store:init:
    internal: true
    env: &store_env
      TF_VAR_state_passphrase:
        sh: printenv TOFU_STATE_PASSPHRASE || security find-generic-password -s "{{.KEYCHAIN_SERVICE}}" -w
      TF_VAR_state_store_data_dir:
        sh: echo "${PLATFORM_DATA_DIR:-$HOME/platform-labs-data/kafka-financial-event-platform}/seaweedfs"
    cmds:
      - mkdir -p "$TF_PLUGIN_CACHE_DIR"
      - tofu -chdir={{.STORE_DIR}} init -input=false

  foundation:bucket:init:
    internal: true
    env: &bucket_env
      TF_VAR_state_passphrase:
        sh: printenv TOFU_STATE_PASSPHRASE || security find-generic-password -s "{{.KEYCHAIN_SERVICE}}" -w
      TF_VAR_s3_endpoint:
        sh: tofu -chdir={{.STORE_DIR}} output -raw endpoint 2>/dev/null || true
      TF_VAR_s3_access_key:
        sh: tofu -chdir={{.STORE_DIR}} output -raw access_key 2>/dev/null || true
      TF_VAR_s3_secret_key:
        sh: tofu -chdir={{.STORE_DIR}} output -raw secret_key 2>/dev/null || true
    cmds:
      - mkdir -p "$TF_PLUGIN_CACHE_DIR"
      - tofu -chdir={{.BUCKET_DIR}} init -input=false

  foundation:plan:
    desc: Plan both foundation stacks (state store and state bucket)
    cmds:
      - task: foundation:store:plan
      - task: foundation:bucket:plan

  foundation:apply:
    desc: Create or update the state store, then the state bucket (pass `-- -auto-approve` to skip prompts)
    cmds:
      - task: foundation:store:apply
      - task: foundation:bucket:apply

  foundation:store:plan:
    internal: true
    deps: [foundation:store:init]
    env: *store_env
    cmds:
      - tofu -chdir={{.STORE_DIR}} plan -input=false

  foundation:store:apply:
    internal: true
    interactive: true
    deps: [foundation:store:init]
    env: *store_env
    cmds:
      - mkdir -p "$TF_VAR_state_store_data_dir"
      - tofu -chdir={{.STORE_DIR}} apply {{.CLI_ARGS}}

  foundation:bucket:plan:
    internal: true
    deps: [foundation:bucket:init]
    env: *bucket_env
    cmds:
      - tofu -chdir={{.BUCKET_DIR}} plan -input=false

  foundation:bucket:apply:
    internal: true
    interactive: true
    deps: [foundation:bucket:init]
    env: *bucket_env
    cmds:
      - tofu -chdir={{.BUCKET_DIR}} apply {{.CLI_ARGS}}

  infra:check:
    desc: Check formatting and validate every OpenTofu stack (no backend, no state, no credentials)
    env:
      # Validation never touches state; a throwaway value satisfies the encryption block.
      TF_VAR_state_passphrase: validate-only-not-a-secret
    cmds:
      - mkdir -p "$TF_PLUGIN_CACHE_DIR"
      - tofu fmt -check -recursive infra
      # Validate a copy without local state files: with -backend=false OpenTofu would
      # otherwise try to read encrypted local state without its encryption settings.
      - |
        set -e
        work=$(mktemp -d)
        trap 'rm -rf "$work"' EXIT
        rsync -a --exclude '*.tfstate' --exclude '*.tfstate.*' --exclude '.terraform/' --exclude '.terraform-*/' infra/ "$work/infra/"
        rsync -a gitops/ "$work/gitops/"  # the bootstrap stack reads chart versions and values from it
        for dir in $(cd "$work" && find infra/stacks -name versions.tf -exec dirname {} \; | sort); do
          echo "validate $dir"
          # A missing lock file would be created silently in CI, hiding unpinned providers.
          test -f "$work/$dir/.terraform.lock.hcl" || { echo "missing $dir/.terraform.lock.hcl (commit it)"; exit 1; }
          tofu -chdir="$work/$dir" init -backend=false -input=false >/dev/null
          tofu -chdir="$work/$dir" validate -no-color
        done

  tofu:
    desc: "Run OpenTofu on a remote-state stack: task tofu STACK=<stack> [PROFILE=<profile>] -- <command> [args]"
    interactive: true
    requires:
      vars: [STACK]
    cmds:
      - scripts/tofu.sh {{.STACK}} {{.PROFILE | default "-"}} {{.CLI_ARGS}}

  cluster:up:
    desc: "Create or update a cluster end to end: task cluster:up PROFILE=dev [REVISION=main] (-- -auto-approve)"
    requires:
      vars: [PROFILE]
    vars:
      REVISION: '{{.REVISION | default "main"}}'
    cmds:
      - scripts/tofu.sh substrate-kind-shared - init
      - scripts/tofu.sh substrate-kind-shared - apply {{.CLI_ARGS}}
      - scripts/tofu.sh substrate-kind {{.PROFILE}} init
      # The kind provider errors instead of planning a re-create when a recorded cluster is
      # gone (e.g. after a Docker reset). Detect that case and replace without refreshing.
      - |
        extra=""
        if scripts/tofu.sh substrate-kind {{.PROFILE}} state list 2>/dev/null | grep -q kind_cluster \
           && ! kind get clusters 2>/dev/null | grep -qx "kfep-{{.PROFILE}}"; then
          echo "kfep-{{.PROFILE}} is recorded in state but missing in Docker: re-creating it"
          extra="-refresh=false -replace=module.cluster.kind_cluster.this"
        fi
        scripts/tofu.sh substrate-kind {{.PROFILE}} apply $extra {{.CLI_ARGS}}
      - scripts/tofu.sh bootstrap {{.PROFILE}} init
      - scripts/tofu.sh bootstrap {{.PROFILE}} apply -var target_revision={{.REVISION}} {{.CLI_ARGS}}
      - task: argo:adopt
        vars: { PROFILE: "{{.PROFILE}}" }
    interactive: true

  argo:adopt:
    desc: "Complete bootstrap-and-adopt: first sync of manual-sync components (ADR 0033): task argo:adopt PROFILE=dev"
    requires:
      vars: [PROFILE]
    env:
      KUBECONFIG:
        sh: echo "$HOME/.kube/kfep-{{.PROFILE}}.yaml"
    cmds:
      # Resources installed by the bootstrap carry no Argo CD tracking annotation until the
      # first sync. Automated components get it by themselves; manual ones need this sync.
      - |
        for config in gitops/platform/*/config.yaml; do
          grep -q '^sync: manual' "$config" || continue
          app=$(awk '/^component:/ {print $2}' "$config")
          for i in $(seq 1 60); do kubectl -n argocd get application "$app" >/dev/null 2>&1 && break; sleep 5; done
          kubectl -n argocd patch application "$app" --type merge \
            -p '{"operation":{"initiatedBy":{"username":"task argo:adopt"},"sync":{}}}' >/dev/null
          echo "adoption sync triggered: $app"
        done

  cluster:down:
    desc: "Destroy a cluster in reverse order (bootstrap, then substrate): task cluster:down PROFILE=dev (-- -auto-approve)"
    requires:
      vars: [PROFILE]
    cmds:
      - scripts/tofu.sh bootstrap {{.PROFILE}} init
      - scripts/tofu.sh bootstrap {{.PROFILE}} destroy {{.CLI_ARGS}}
      - scripts/tofu.sh substrate-kind {{.PROFILE}} init
      - scripts/tofu.sh substrate-kind {{.PROFILE}} destroy {{.CLI_ARGS}}
    interactive: true

  argo:sync:
    desc: "Trigger a sync of an Argo CD Application (for manual-sync components): task argo:sync APP=cilium [PROFILE=dev]"
    requires:
      vars: [APP]
    vars:
      PROFILE: '{{.PROFILE | default "dev"}}'
    env:
      KUBECONFIG:
        sh: echo "$HOME/.kube/kfep-{{.PROFILE}}.yaml"
    cmds:
      - kubectl -n argocd get application {{.APP}} -o jsonpath='{.status.sync.status}{"\n"}'
      - kubectl -n argocd patch application {{.APP}} --type merge -p '{"operation":{"initiatedBy":{"username":"task argo:sync"},"sync":{}}}'

  gitops:check:
    desc: Render every GitOps component for every profile and substrate and validate the manifests
    cmds:
      - python3 scripts/gitops_check.py

  # Host operations (ADR 0034, docs/runbooks/host-operations.md).
  lab:status:
    desc: Show lab containers and their memory use
    cmds:
      - scripts/lab.sh status

  lab:stop:
    desc: "L0: stop the lab (clusters, load balancer, state store) without removing anything"
    cmds:
      - scripts/lab.sh stop

  lab:start:
    desc: "L0/L1: start a stopped lab and wait for nodes"
    cmds:
      - scripts/lab.sh start

  lab:backup:
    desc: "L3 prevention: consistent archive of the state store data and foundation state"
    cmds:
      - scripts/lab.sh backup {{.CLI_ARGS}}

  lab:restore-state:
    desc: "L3: restore state data from an archive: task lab:restore-state -- <archive>"
    cmds:
      - scripts/lab.sh restore-state {{.CLI_ARGS}}

  lab:restore:
    desc: "L2: rebuild everything from code after a Docker reset: task lab:restore PROFILE=dev (-- -auto-approve)"
    requires:
      vars: [PROFILE]
    cmds:
      - task: foundation:apply
      - task: cluster:up
        vars: { PROFILE: "{{.PROFILE}}", REVISION: '{{.REVISION | default "main"}}' }

  lab:drill:docker-reset:
    desc: "Drill for L2: remove this lab's containers, clusters and images (nothing else)"
    prompt: This deletes the lab's clusters and images (state data on the host is kept). Continue?
    cmds:
      - scripts/lab.sh drill-docker-reset

  lab:purge:
    desc: "L4: remove everything this lab placed on the machine (asks for confirmation)"
    interactive: true
    cmds:
      - scripts/lab.sh purge
