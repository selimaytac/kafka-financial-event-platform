# Issues certificates from the lab intermediate CA (ADR 0035).
crds:
  enabled: true
  # Keep CRDs (and therefore every Certificate) if the release is ever removed.
  keep: true

# Metrics Services only; the ServiceMonitor lives in the monitoring addon, because a core
# component must not depend on an addon's CRDs (ADR 0039).
prometheus:
  servicemonitor:
    enabled: false

# Requests from measured working sets (controller ~41Mi, cainjector ~69Mi, webhook ~28Mi);
# memory limits with headroom, no CPU limits (ADR 0037). Required by require-memory-limits
# once it is enforced (ADR 0038), including the post-install check Job.
resources:
  requests: { cpu: 10m, memory: 64Mi }
  limits: { memory: 192Mi }
cainjector:
  resources:
    requests: { cpu: 10m, memory: 96Mi }
    limits: { memory: 256Mi }
webhook:
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 96Mi }
startupapicheck:
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 64Mi }
