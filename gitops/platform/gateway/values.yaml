domain: kfep.localhost

issuer:
  # ClusterIssuer backed by the per-profile intermediate CA (secret created by the bootstrap).
  name: kfep-intermediate-ca
  caSecretName: kfep-intermediate-ca

service:
  # LoadBalancer on substrates with one; kind overrides it (values-substrate-kind.yaml).
  type: LoadBalancer
  nodePort: null
  # Local keeps the client IP (useful for rate limits and audit logs); a real load
  # balancer only sends traffic to nodes that run the proxy.
  externalTrafficPolicy: Local

routes:
  argocd:
    enabled: true
    host: argocd
    namespace: argocd
    service: argocd-server
    port: 80
  grafana:
    enabled: true
    host: grafana
    namespace: monitoring
    service: monitoring-grafana
    port: 80
