# "restricted" installs the baseline and the restricted controls (ADR 0038).
podSecurityStandard: restricted
policyType: ValidatingPolicy
# Ignore while every policy is in Audit: an audit-only policy must not block pod creation
# when Kyverno is down or has just been disabled (ADR 0039). Moves to Fail together with
# Enforce; the webhooks exclude kube-system and kyverno, so the engine can always restart.
failurePolicy: Ignore
# Rollout: everything starts in Audit; baseline controls move to Enforce once the policy
# reports are clean or covered by exceptions. Restricted controls stay in Audit (visibility):
# many third-party charts do not meet them.
validationFailureAction: Audit
validationFailureActionByPolicy: {}
