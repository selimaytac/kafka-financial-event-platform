# Core components: always installed (ADR 0039). The list is explicit so that a new
# component is an addon until it is deliberately promoted; scripts/gitops_check.py checks
# that it matches the configs marked "tier: core".
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
nameSuffix: -core
patches:
  - target: { kind: ApplicationSet, name: platform }
    patch: |
      - op: add
        path: /spec/syncPolicy
        value:
          # Removing a component from Git must not uninstall the CNI or Argo CD by accident.
          preserveResourcesOnDeletion: true
      - op: replace
        path: /spec/generators/0/matrix/generators/0/git/files
        value:
          - path: gitops/platform/cilium/config.yaml
          - path: gitops/platform/argocd/config.yaml
          - path: gitops/platform/cert-manager/config.yaml
          - path: gitops/platform/envoy-gateway/config.yaml
          - path: gitops/platform/gateway/config.yaml
