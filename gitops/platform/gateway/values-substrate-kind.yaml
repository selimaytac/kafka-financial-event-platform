# kind: fixed NodePort reached through 127.0.0.1:<profile port>
# (kind extraPortMappings, ADR 0034/0035). A random load-balancer port would break OIDC redirects.
service:
  type: NodePort
  nodePort: 30443
  # The port mapping lands on the control-plane node while the proxy may run elsewhere;
  # Local would drop that traffic. The client IP is always the host here anyway.
  externalTrafficPolicy: Cluster
