# One Application per selected gitops/platform/<component>/config.yaml (ADR 0030, ADR 0035).
# Shared by the core and addons overlays (ADR 0039), which set the name, the files list
# and the deletion behaviour. Cluster parameters (profile, substrate, Git revision) come
# from a single list element; the root Application replaces that element, so they are
# injected in exactly one place.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: platform
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - git:
              repoURL: https://github.com/selimaytac/kafka-financial-event-platform.git
              revision: REVISION
              files: [] # set by each overlay
          - list:
              elements:
                - profile: PROFILE
                  substrate: SUBSTRATE
                  revision: REVISION
  template:
    metadata:
      name: "{{ .component }}"
    spec:
      project: default
      sources: []
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{ .namespace }}"
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          # Components may use CRDs installed by other components; retry until they exist.
          - SkipDryRunOnMissingResource=true
  # Sources depend on where the chart lives: a Helm repository (HTTPS or OCI) or a local
  # chart in this repository. Values are layered: base, profile, substrate.
  # Sync mode comes from config.yaml: "manual" for components whose failure would stop
  # reconciliation itself (the CNI, Argo CD), ADR 0033.
  templatePatch: |
    {{- if eq (index . "diff" | default "") "server-side" }}
    metadata:
      annotations:
        # Server-side diff only where API-server defaults cause false drift (ADR 0036):
        # it sends a dry-run apply for every resource on every comparison.
        argocd.argoproj.io/compare-options: ServerSideDiff=true
    {{- end }}
    spec:
      sources:
        {{- if hasKey .chart "path" }}
        - repoURL: https://github.com/selimaytac/kafka-financial-event-platform.git
          targetRevision: "{{ .revision }}"
          path: "{{ .chart.path }}"
        {{- else }}
        - repoURL: "{{ .chart.repoURL }}"
          chart: "{{ .chart.name }}"
          targetRevision: "{{ .chart.version }}"
        {{- end }}
          helm:
            releaseName: "{{ .component }}"
            ignoreMissingValueFiles: true
            valueFiles:
              - "$values/{{ .path.path }}/values.yaml"
              - "$values/{{ .path.path }}/values-{{ .profile }}.yaml"
              - "$values/{{ .path.path }}/values-substrate-{{ .substrate }}.yaml"
        - repoURL: https://github.com/selimaytac/kafka-financial-event-platform.git
          targetRevision: "{{ .revision }}"
          ref: values
      {{- if eq .sync "automated" }}
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 10
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 5m
      {{- end }}
