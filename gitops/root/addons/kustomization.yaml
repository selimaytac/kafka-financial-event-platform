# Optional components (ADR 0039). The root Application replaces the files list with the
# addons selected for the cluster; the default matches no file, so nothing is installed.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
nameSuffix: -addons
patches:
  - target: { kind: ApplicationSet, name: platform }
    patch: |
      - op: add
        path: /spec/syncPolicy
        value:
          # Disabling an addon removes its resources and frees the memory it used.
          preserveResourcesOnDeletion: false
      - op: replace
        path: /spec/generators/0/matrix/generators/0/git/files
        value:
          - path: gitops/platform/none/config.yaml
      - op: add
        path: /spec/template/metadata/finalizers
        value:
          - resources-finalizer.argocd.argoproj.io
