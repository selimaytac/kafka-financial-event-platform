{{- range $name, $route := .Values.routes }}
{{- if $route.enabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $name }}
  namespace: {{ $route.namespace }}
spec:
  parentRefs:
    - name: platform
      namespace: {{ $.Release.Namespace }}
      sectionName: https
  hostnames:
    - "{{ $route.host }}.{{ $.Values.domain }}"
  rules:
    - backendRefs:
        - name: {{ $route.service }}
          port: {{ $route.port }}
{{- end }}
{{- end }}
