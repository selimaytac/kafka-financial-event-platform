# Every workload has explicit requests and limits: memory is the scarcest resource and
# the policy baseline will require them (ADR 0037).

prometheus:
  prometheusSpec:
    scrapeInterval: 30s
    # Pick up monitors and rules from every component, not only this release.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    # Whichever limit is reached first applies.
    retention: 10d
    retentionSize: 8GiB
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 10Gi
    resources:
      requests: { cpu: 100m, memory: 400Mi }
      limits: { memory: 1Gi }

  # Cilium and Argo CD are installed at bootstrap, before monitoring CRDs exist, so their
  # monitors are owned here instead of by their own charts.
  additionalPodMonitors:
    - name: cilium-agent
      namespaceSelector: { matchNames: [kube-system] }
      selector: { matchLabels: { k8s-app: cilium } }
      podMetricsEndpoints:
        - port: prometheus
        - port: hubble-metrics
    - name: cilium-operator
      namespaceSelector: { matchNames: [kube-system] }
      selector: { matchLabels: { io.cilium/app: operator } }
      podMetricsEndpoints:
        - port: prometheus
  additionalServiceMonitors:
    - name: argocd
      namespaceSelector: { matchNames: [argocd] }
      selector: { matchLabels: { app.kubernetes.io/part-of: argocd } }
      endpoints:
        - port: http-metrics

alertmanager:
  config:
    # Alerts are visible in the UI only; a delivery channel comes later (ADR 0037).
    route:
      receiver: "null"
      group_by: [alertname, namespace]
      routes:
        - receiver: "null"
          matchers: [alertname = "Watchdog"]
    receivers:
      - name: "null"
  alertmanagerSpec:
    resources:
      requests: { cpu: 10m, memory: 32Mi }
      limits: { memory: 96Mi }

grafana:
  admin:
    # Generated by OpenTofu and created by the bootstrap stack (ADR 0026); a chart-generated
    # password would change on every render.
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  persistence:
    enabled: false
  # First start runs database migrations and loads dashboards, which can take minutes on
  # a busy node. The startup probe holds off liveness until then; without it the liveness
  # probe kills Grafana mid-start (observed).
  startupProbe:
    httpGet:
      path: /api/health
      port: grafana
    periodSeconds: 10
    failureThreshold: 60
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { memory: 256Mi }
  sidecar:
    resources:
      requests: { cpu: 10m, memory: 48Mi }
      limits: { memory: 96Mi }

prometheusOperator:
  resources:
    requests: { cpu: 20m, memory: 64Mi }
    limits: { memory: 160Mi }
  prometheusConfigReloader:
    resources:
      requests: { cpu: 10m, memory: 24Mi }
      limits: { memory: 48Mi }

kube-state-metrics:
  resources:
    requests: { cpu: 10m, memory: 64Mi }
    limits: { memory: 160Mi }

prometheus-node-exporter:
  resources:
    requests: { cpu: 10m, memory: 24Mi }
    limits: { memory: 64Mi }

# Symptom-based alerts with a runbook link. Each must be actionable.
additionalPrometheusRulesMap:
  platform:
    groups:
      - name: gitops
        rules:
          - alert: ArgoApplicationOutOfSync
            expr: argocd_app_info{sync_status="OutOfSync"} == 1
            for: 30m
            labels: { severity: warning }
            annotations:
              summary: "Argo CD application {{ $labels.name }} is out of sync"
              description: "Git and the cluster differ for 30 minutes. Manual-sync components (Cilium, Argo CD) need task argo:sync after review."
              runbook_url: https://github.com/selimaytac/kafka-financial-event-platform/blob/main/docs/runbooks/recover-argocd.md
          - alert: ArgoApplicationUnhealthy
            expr: argocd_app_info{health_status!~"Healthy|Progressing"} == 1
            for: 15m
            labels: { severity: critical }
            annotations:
              summary: "Argo CD application {{ $labels.name }} is {{ $labels.health_status }}"
              runbook_url: https://github.com/selimaytac/kafka-financial-event-platform/blob/main/docs/runbooks/recover-argocd.md
      - name: certificates
        rules:
          # Renewal starts 30 days before expiry; under 14 days means renewal has been failing.
          - alert: CertificateRenewalFailing
            expr: certmanager_certificate_expiration_timestamp_seconds - time() < 14 * 24 * 3600
            for: 1h
            labels: { severity: critical }
            annotations:
              summary: "Certificate {{ $labels.namespace }}/{{ $labels.name }} expires in under 14 days"
          - alert: CertificateNotReady
            expr: certmanager_certificate_ready_status{condition="False"} == 1
            for: 15m
            labels: { severity: warning }
            annotations:
              summary: "Certificate {{ $labels.namespace }}/{{ $labels.name }} is not ready"
