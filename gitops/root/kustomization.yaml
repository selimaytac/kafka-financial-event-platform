# Root of the GitOps tree: two ApplicationSets, core and addons (ADR 0039). The root
# Application (created by the bootstrap stack) injects the profile, the Git revision and
# the selected addons through inline Kustomize patches, so this tree has no per-profile
# copies.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - core
  - addons
