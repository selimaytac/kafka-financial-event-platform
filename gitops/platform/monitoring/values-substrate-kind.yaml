# kind binds etcd, the scheduler, the controller manager and kube-proxy metrics to the
# node's loopback, so they cannot be scraped; monitoring them would only raise false alerts.
kubeEtcd: { enabled: false }
kubeScheduler: { enabled: false }
kubeControllerManager: { enabled: false }
kubeProxy: { enabled: false }
defaultRules:
  rules:
    etcd: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
    kubeControllerManager: false
    kubeProxy: false
  # kind nodes are containers: the clock belongs to the host kernel and the node never
  # reports its own NTP synchronisation, so these would fire permanently (observed).
  disabled:
    NodeClockNotSynchronising: true
    NodeClockSkewDetected: true
